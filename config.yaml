# --- 接收参数 ---
receiver:
  # 并发连接数上限 (每个连接占用一个 KiwiSDR 通道)
  max_concurrent: 2
  # 每个频率的监听时长 (秒), 0 = 无限
  listen_duration: 0
  # 频率扫描模式下每个频率的停留时间 (秒)
  scan_dwell_time: 30
  # 音频采样率 (KiwiSDR 默认 12000 Hz)
  sample_rate: 12000
  # 音频带宽 (Hz)
  bandwidth: 6000

# --- 静噪 (VOX) 设置 ---
# 实测: KiwiSDR 在 11175 kHz USB 的底噪 RMS 约 0.04~0.05
# EAM 信号峰值 RMS 通常在 0.12~0.23 范围
# 2026-06-09: 经 EAM.watch 录音对比，0.15 阈值漏掉 75% 信号，降至 0.10
#
# !! 这里的阈值是"绝对电平"，而节点开着 AGC (见 kiwi_client 的 SET agc=1)，
#    同一个信号在不同节点上的 RMS 可以差好几倍。0.65 -> 0.15 -> 0.10 三次
#    手调调的其实都是节点的 AGC，不是信号本身。而且 0.10 是拿 EAM.watch 的
#    录音(另一台接收机、另一套电平)按 1024 点窗口回放算出来的，实时检测器
#    是按收到的每个 KiwiSDR 音频帧(512 点)算 RMS —— 两边口径都不一样，
#    这个数字并没有在自己的接收链路上校准过。
#    换节点/换频率后请先量一次再决定用多少:
#        python diagnose_rms.py -f 11175          # 单个节点
#        python diagnose_rms.py -f 11175 --all-nodes
#    Web 界面上也有实测底噪和"按底噪设定"(底噪 +6 dB)。
squelch:
  # 静噪开启阈值 (RMS 能量, 0-1 范围)
  # EAM.watch 对比: 0.10 检测率 100%, 0.15 仅 25%
  open_threshold: 0.10
  # 静噪关闭阈值 (约 open 的 85%，形成滞后防止频繁切换)
  close_threshold: 0.085
  # 信号消失后继续录制的延迟 (秒), 防止截断信号尾部
  tail_time: 3.0
  # 分析窗口大小 (采样点数)
  # 注意: 只有 compare_eam.py 的离线回放用它。实时的 SquelchDetector 是按
  # 收到的每个音频帧算 RMS(KiwiSDR 一帧 512 点 = 42.7 ms)，不读这个值。
  window_size: 1024

# --- 录制设置 ---
recording:
  # 录音文件输出目录
  output_dir: "data/recordings"
  # 最长单段录音时长 (秒), 超过后自动分段
  max_duration: 300
  # WAV 文件位深 (16 或 32)
  bit_depth: 16
  # pre-roll 缓冲 (秒), 保留信号开始前的音频
  pre_roll: 2.0

# --- 数据库设置 ---
database:
  path: "data/radio_monitor.db"

# --- 分析设置 ---
# 所有频域指标都限制在解调通带内 (USB 为 300-3000 Hz, 见 src/modes.py)
analysis:
  # FFT 大小
  fft_size: 4096
  # 频谱分析窗口类型: hann, hamming, blackman
  window_type: "hann"
  # 旧口径带宽估算阈值 (dB below peak), 仅用于和历史数据对照
  bandwidth_threshold_db: 20
  # 带内噪声基底取第几百分位 (越低越不容易被占满通带的信号抬高)
  noise_percentile: 20
  # 低于该带内 SNR 判定为 NOISE (dB)
  noise_snr_threshold_db: 3.0
  # 调制判定的最低置信度, 低于此值输出 UNKNOWN 而不是硬猜
  min_confidence: 0.35

# --- 报告设置 ---
report:
  output_dir: "reports"
  # 报告包含的最近天数
  recent_days: 7
  # 图表 DPI
  chart_dpi: 150
  # 图表主题: dark, light
  chart_theme: "dark"
