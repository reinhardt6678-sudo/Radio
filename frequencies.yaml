# --- 时间信号 / 校准参考 ---
# 这些不是军事频率，但可用于校准接收器和验证系统工作正常
reference:
  description: "标准时间信号 - 用于系统校准验证"
  frequencies:
    - freq: 5000.0
      mode: "AM"
      description: "WWV 美国标准时间信号 (5 MHz)"
      active_hours: "24小时"
      priority: low

    - freq: 10000.0
      mode: "AM"
      description: "WWV 美国标准时间信号 (10 MHz)"
      active_hours: "24小时"
      priority: low

    - freq: 15000.0
      mode: "AM"
      description: "WWV 美国标准时间信号 (15 MHz)"
      active_hours: "24小时"
      priority: low
